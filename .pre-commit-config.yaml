# Install once per clone:  uv tool install pre-commit && pre-commit install
# Runs gitleaks on staged changes before every commit.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--config, backend/pyproject.toml]
  - repo: local
    hooks:
      - id: no-session-trailers
        name: reject agent session identifiers in commit messages
        entry: bash -c 'if grep -qiE "^(Claude-Session|X-Claude-Session)[-A-Za-z]*:" "$1"; then echo "commit message contains a session identifier trailer"; exit 1; fi' --
        language: system
        stages: [commit-msg]
